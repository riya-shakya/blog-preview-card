<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- displays site properly based on user's device -->

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Figtree:ital,wght@0,300..900;1,300..900&family=Outfit:wght@100..900&display=swap"
      rel="stylesheet"
    />
    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="./assets/images/favicon-32x32.png"
    />
    <link rel="stylesheet" href="./styles.css" />

    <title>Frontend Mentor | Blog preview card</title>
  </head>
  <body>
    <article class="blog-card">
      <img
        src="./assets/images/illustration-article.svg"
        alt="illustration of the course"
      />
      <div class="blog-card-content">
        <div class="blog-tag"><p>Learning</p></div>
        <p class="blog-date">Published 21 Dec 2023</p>
        <h1>HTML & CSS foundations</h1>
        <p class="blog-description">
          These languages are the backbone of every website, defining structure,
          content, and presentation.
        </p>
        <div class="blog-author">
          <img
            src="./assets/images/image-avatar.webp"
            alt="profile picture of the author"
          />
          <h3>Greg Hooper</h3>
        </div>
      </div>
    </article>

    <footer class="attribution">
      Challenge by
      <a href="https://www.frontendmentor.io?ref=challenge">Frontend Mentor</a>.
      Coded by <a href="#">Riya</a>.
    </footer>
  </body>
</html>
